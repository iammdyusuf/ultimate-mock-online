<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ultimate Online Mock</title>
<style>
body{font-family:Arial;margin:0;background:#f3f6fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:white;padding:20px;border-radius:15px;margin:15px 0;box-shadow:0 8px 25px #0001}input,button,select{width:100%;padding:12px;margin:6px 0;border-radius:9px;border:1px solid #ccd4df;box-sizing:border-box}button{background:#2563eb;color:#fff;border:0;font-weight:bold;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{padding:12px;border:1px solid #ccd4df;border-radius:9px;margin:8px 0;cursor:pointer}.hidden{display:none}.timer{font-size:25px;color:#dc2626;font-weight:bold}.rank{padding:10px;border-bottom:1px solid #ddd}.danger{background:#dc2626}.muted{color:#667085}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head>
<body><div class="wrap">
<h1>⚡ Ultimate Online Mock</h1>
<div id="auth" class="card"><h2>Login / Register</h2><div class="grid"><div><h3>Login</h3><input id="le" placeholder="Email"><input id="lp" type="password" placeholder="Password"><button onclick="login()">Login</button></div><div><h3>Register</h3><input id="rn" placeholder="Name"><input id="re" placeholder="Email"><input id="rp" type="password" placeholder="Password (6+)"><button onclick="register()">Create Account</button></div></div><p id="msg"></p></div>
<div id="app" class="hidden"><div class="card"><b id="who"></b><button onclick="logout()">Logout</button></div>
<div id="home"><div class="card"><h2>Start Exam</h2><input id="title" value="Online Mock Test"><div class="grid"><input id="n" type="number" value="10" min="1"><input id="mins" type="number" value="15" min="1"></div><button onclick="start()">🚀 Start</button></div><div class="card"><h2>🏆 Live Leaderboard</h2><div id="lb"></div></div><div class="card"><h2>My History</h2><div id="hist"></div></div><div id="admin" class="card hidden"><h2>🔐 Admin Panel</h2><p id="astats"></p><textarea id="bulk" rows="8" placeholder='Paste JSON array of questions here'></textarea><button onclick="bulkImport()">Bulk Import JSON</button></div></div>
<div id="exam" class="hidden"><div class="card"><div class="timer" id="timer"></div><p id="meta"></p><h2 id="q"></h2><div id="opts"></div><button onclick="prev()">Previous</button><button onclick="next()">Next</button><button class="danger" onclick="submitExam()">Submit</button></div></div>
<div id="result" class="hidden"><div class="card"><h2>Result</h2><h1 id="score"></h1><p id="detail"></p><button onclick="goHome()">Dashboard</button></div></div></div></div>
<script>
let token=localStorage.getItem("umt_token"),user=JSON.parse(localStorage.getItem("umt_user")||"null"),items=[],ans=[],idx=0,timer=null,seconds=0,examTitle="";
const $=id=>document.getElementById(id);
function api(url,opt={}){opt.headers=Object.assign({"Content-Type":"application/json"},opt.headers||{},token?{Authorization:"Bearer "+token}:{});return fetch(url,opt).then(async r=>{let d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d})}
function setMsg(x){$("msg").textContent=x}
async function login(){try{let d=await api("/api/auth/login",{method:"POST",body:JSON.stringify({email:$("le").value,password:$("lp").value})});setSession(d)}catch(e){setMsg(e.message)}}
async function register(){try{let d=await api("/api/auth/register",{method:"POST",body:JSON.stringify({name:$("rn").value,email:$("re").value,password:$("rp").value})});setSession(d)}catch(e){setMsg(e.message)}}
function setSession(d){token=d.token;user=d.user;localStorage.setItem("umt_token",token);localStorage.setItem("umt_user",JSON.stringify(user));boot()}
function logout(){localStorage.removeItem("umt_token");localStorage.removeItem("umt_user");location.reload()}
async function boot(){if(!token)return;try{await api("/api/me");$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("who").textContent=`👤 ${user.name} (${user.role})`;if(user.role==="admin")$("admin").classList.remove("hidden");loadHome()}catch{logout()}}
async function loadHome(){let [lb,h]=await Promise.all([api("/api/leaderboard"),api("/api/my-results")]);$("lb").innerHTML=lb.map((x,i)=>`<div class="rank">#${i+1} <b>${x.name}</b> — ${x.percentage}% (${x.tests} tests)</div>`).join("")||"No results";$("hist").innerHTML=h.map(x=>`<div class="rank">${x.exam_title}: <b>${x.percentage}%</b> — ${new Date(x.created_at).toLocaleString()}</div>`).join("")||"No tests";if(user.role==="admin"){let s=await api("/api/admin/stats");$("astats").textContent=`Questions: ${s.questions} | Students: ${s.users} | Tests: ${s.tests}`}}
async function start(){let q=await api("/api/questions");let n=Math.min(Number($("n").value)||10,q.length);q.sort(()=>Math.random()-0.5);items=q.slice(0,n);ans=Array(n).fill(null);idx=0;examTitle=$("title").value||"Mock Test";seconds=(Number($("mins").value)||15)*60;$("home").classList.add("hidden");$("exam").classList.remove("hidden");render();clearInterval(timer);timer=setInterval(()=>{seconds--;clock();if(seconds<=0)submitExam()},1000);clock()}
function clock(){$("timer").textContent=`Time: ${String(Math.floor(seconds/60)).padStart(2,"0")}:${String(seconds%60).padStart(2,"0")}`}
function render(){let x=items[idx];$("meta").textContent=`Question ${idx+1}/${items.length}`;$("q").textContent=x.question;$("opts").innerHTML=[x.optionA,x.optionB,x.optionC,x.optionD].map((o,i)=>`<div class="option" onclick="ans[${idx}]=${i};render()"><b>${"ABCD"[i]}.</b> ${o}</div>`).join("")}
function prev(){if(idx>0){idx--;render()}}function next(){if(idx<items.length-1){idx++;render()}else submitExam()}
async function submitExam(){clearInterval(timer);let c=0,w=0,u=0;items.forEach((x,i)=>{if(ans[i]===null)u++;else if(ans[i]===x.answer)c++;else w++});let pct=Math.round(c/items.length*100);await api("/api/results",{method:"POST",body:JSON.stringify({examTitle,correct:c,wrong:w,unanswered:u,total:items.length,rawScore:c,percentage:pct})});$("exam").classList.add("hidden");$("result").classList.remove("hidden");$("score").textContent=pct+"%";$("detail").textContent=`Correct: ${c} | Wrong: ${w} | Unanswered: ${u}`;loadHome()}
function goHome(){$("result").classList.add("hidden");$("home").classList.remove("hidden");loadHome()}
async function bulkImport(){try{let q=JSON.parse($("bulk").value);let d=await api("/api/questions/bulk",{method:"POST",body:JSON.stringify({questions:q})});alert(`Imported ${d.inserted} questions`);loadHome()}catch(e){alert(e.message)}}
boot();
</script></body></html>
